<!DOCTYPE html>

<html class="light" lang="zh-TW">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Mockview AI - Interview Cockpit</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Sora:wght@400;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb95f",
                        "inverse-surface": "#302f39",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-primary-fixed": "#0f0069",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffddb8",
                        "secondary": "#006c49",
                        "surface-container-highest": "#e4e1ed",
                        "primary-fixed-dim": "#c3c0ff",
                        "primary-fixed": "#e2dfff",
                        "secondary-container": "#6cf8bb",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container-high": "#eae6f3",
                        "on-background": "#1b1b23",
                        "surface-bright": "#fcf8ff",
                        "background": "#fcf8ff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-secondary-fixed": "#002113",
                        "surface-dim": "#dbd8e4",
                        "tertiary": "#684000",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#885500",
                        "inverse-primary": "#c3c0ff",
                        "on-primary-container": "#dad7ff",
                        "on-secondary-container": "#00714d",
                        "surface-container": "#efecf8",
                        "surface-variant": "#e4e1ed",
                        "on-surface-variant": "#464555",
                        "surface": "#fcf8ff",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#ffd4a4",
                        "surface-tint": "#4d44e3",
                        "on-secondary-fixed-variant": "#005236",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "primary": "#3525cd",
                        "on-error": "#ffffff",
                        "primary-container": "#4f46e5",
                        "inverse-on-surface": "#f2effb",
                        "on-error-container": "#93000a",
                        "on-surface": "#1b1b23",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#4edea3",
                        "secondary-fixed": "#6ffbbe",
                        "surface-container-low": "#f5f2fe",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "data-mono": [
                            "JetBrains Mono"
                        ],
                        "headline-lg": [
                            "Sora"
                        ],
                        "label-caps": [
                            "JetBrains Mono"
                        ],
                        "display-lg": [
                            "Sora"
                        ],
                        "headline-lg-mobile": [
                            "Sora"
                        ],
                        "body-md": [
                            "Sora"
                        ]
                    },
                    "fontSize": {
                        "data-mono": [
                            "14px",
                            {
                                "lineHeight": "20px",
                                "letterSpacing": "0.02em",
                                "fontWeight": "500"
                            }
                        ],
                        "headline-lg": [
                            "32px",
                            {
                                "lineHeight": "40px",
                                "letterSpacing": "-0.01em",
                                "fontWeight": "600"
                            }
                        ],
                        "label-caps": [
                            "12px",
                            {
                                "lineHeight": "16px",
                                "fontWeight": "700"
                            }
                        ],
                        "display-lg": [
                            "48px",
                            {
                                "lineHeight": "56px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "700"
                            }
                        ],
                        "headline-lg-mobile": [
                            "24px",
                            {
                                "lineHeight": "32px",
                                "fontWeight": "600"
                            }
                        ],
                        "body-md": [
                            "16px",
                            {
                                "lineHeight": "24px",
                                "fontWeight": "400"
                            }
                        ]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom Animations */
        @keyframes mvPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4);
            }

            70% {
                box-shadow: 0 0 0 16px rgba(79, 70, 229, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
            }
        }

        .animate-mvPulse {
            animation: mvPulse 2s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        @keyframes mvBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .animate-mvBlink {
            animation: mvBlink 1s step-end infinite;
        }

        /* Waveform Animation */
        .waveform-bar {
            width: 6px;
            background-color: #4f46e5;
            border-radius: 9999px;
            animation: wave 1.2s ease-in-out infinite;
            transform-origin: bottom;
        }

        .waveform-bar.bg-dim {
            background-color: rgba(12, 12, 20, 0.1);
            animation: none;
            height: 10%;
        }

        @keyframes wave {

            0%,
            100% {
                transform: scaleY(0.2);
            }

            50% {
                transform: scaleY(1);
            }
        }

        /* Level 1 Card styling */
        .level-1-card {
            background-color: #ffffff;
            border: 1px solid rgba(12, 12, 20, 0.08);
            box-shadow: none;
        }
    </style>
</head>

<body class="bg-surface text-on-surface h-screen flex flex-col overflow-hidden font-body-md text-body-md">
    <!-- Top Focus Bar (Minimalist Cockpit Header) -->
    <header
        class="flex-none flex justify-between items-center w-full px-margin-desktop h-16 border-b border-outline-variant/30">
        <div class="flex items-center gap-4">
            <button aria-label="Exit Interview"
                class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
                <span class="material-symbols-outlined">close</span>
            </button>
            <div class="h-4 w-px bg-outline-variant/50"></div>
            <div class="flex items-center gap-2 text-on-surface-variant">
                <span class="material-symbols-outlined text-[18px]">radio_button_checked</span>
                <span class="font-label-caps text-label-caps tracking-widest uppercase">當前階段：專案實作深度追問</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">timer</span>
            <span class="font-data-mono text-data-mono text-primary bg-primary/10 px-3 py-1 rounded-md">01:45</span>
        </div>
    </header>
    <!-- Main Cockpit Area -->
    <main
        class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 grid grid-cols-1 lg:grid-cols-12 gap-gutter h-full overflow-hidden">
        <!-- Left Panel: AI Professor & Question (5 columns) -->
        <section class="lg:col-span-5 flex flex-col h-full gap-6">
            <!-- AI Avatar & Visualizer Container -->
            <div class="flex-none flex flex-col items-center justify-center py-8 relative">
                <!-- Glowing Avatar -->
                <div class="relative mb-8">
                    <div
                        class="absolute inset-0 rounded-full ring-4 ring-primary-container ring-opacity-20 animate-[pulse_4s_ease-in-out_infinite] scale-110">
                    </div>
                    <img class="w-32 h-32 rounded-full object-cover border-4 border-surface shadow-sm relative z-10"
                        data-alt="A highly detailed, professional headshot of a sophisticated AI avatar designed as a university professor. The avatar has a modern, clinical aesthetic with subtle futuristic elements, set against a pristine, high-key white background. Soft, diffused lighting creates a sense of intelligence and academic authority, fitting for a high-stakes mock interview environment."
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqC2pswO3FPBlDhCffhVeyAiggy-MwnKLaeCaR2Bi1xt40tuF6z3-2IBQpaRCcwDI8Q9k3biVci6SnumJRP8JgxSxaFE8jQ_O7q9oVD4LUP9qms6ZkLp-0KZ1xvOt77vJf1Zr6tASz6IUy5FRQeqlOSxaePbpJ8Pa8b1673yRkz5H5TzAfMZiqAkQ2uT0OFWDZUId7AsL-C0psn1DVHIq1in5MyBhp2p0Qum4mf7xIXoLvyA7yhkhD" />
                </div>
                <!-- 16-bar Voice Visualizer (mvWaveform) -->
                <div class="flex items-end gap-1.5 h-12 w-48 justify-center" id="ai-waveform">
                    <!-- Bars injected via JS for staggered animation -->
                </div>
                <div class="mt-4 font-label-caps text-label-caps text-primary tracking-widest uppercase opacity-80">
                    系統發話中
                </div>
            </div>
            <!-- Active Interview Question Card -->
            <div
                class="level-1-card rounded-xl p-6 border-l-4 border-l-primary flex-grow flex flex-col relative overflow-hidden">
                <!-- Scanning animation effect -->
                <div
                    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary-container to-transparent opacity-50 animate-[pulse_2s_ease-in-out_infinite]">
                </div>
                <h2 class="font-label-caps text-label-caps text-on-surface-variant mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-[16px]">psychology</span>
                    核心追問
                </h2>
                <div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                    在您提到的電商平台專案中，當遇到高併發的搶購情境時，您是如何處理資料庫鎖定 (Database Locking) 導致的效能瓶頸？
                </div>
                <div class="mt-auto pt-6 text-on-surface-variant/70 font-body-md text-[14px]">
                    請具體說明您採用的技術架構與衡量指標。
                </div>
            </div>
        </section>
        <!-- Right Panel: Transcription & Controls (7 columns) -->
        <section class="lg:col-span-7 flex flex-col h-full gap-6">
            <!-- STT Transcription Card -->
            <div class="level-1-card rounded-xl p-6 flex-grow flex flex-col relative bg-surface-container-lowest">
                <div class="flex justify-between items-center mb-6 border-b border-outline-variant/30 pb-4">
                    <div class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">closed_caption</span>
                        即時語音轉文字
                    </div>
                    <div class="font-data-mono text-[12px] text-primary/70 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                        REC
                    </div>
                </div>
                <div class="flex-grow overflow-y-auto font-body-md text-body-md text-on-surface leading-relaxed pr-2">
                    <span class="opacity-70">針對這個問題，我們當時主要面臨的是庫存扣減時的 Row-level lock 競爭。為了解決這個瓶頸，我們首先引入了 Redis
                        作為第一層的快取防護，將庫存數量...</span>
                    <!-- Blinking Cursor (mvBlink) -->
                    <span class="inline-block w-[2px] h-[18px] bg-primary align-middle ml-1 animate-mvBlink"></span>
                </div>
            </div>
            <!-- Cockpit Controls Area -->
            <div
                class="level-1-card rounded-xl p-6 flex items-center justify-between bg-surface-container-low border-t border-outline-variant/20">
                <!-- Secondary Action: Request Hint -->
                <button
                    class="px-6 py-3 rounded text-on-surface-variant font-body-md text-body-md font-medium border border-outline-variant hover:bg-surface-variant transition-colors flex items-center gap-2">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lightbulb</span>
                    請求引導提示
                </button>
                <!-- Central Mic Control (mvPulse) -->
                <div class="flex flex-col items-center justify-center gap-3">
                    <button aria-label="Toggle Recording"
                        class="w-20 h-20 bg-primary-container text-on-primary rounded-full flex items-center justify-center animate-mvPulse shadow-lg hover:bg-primary transition-colors focus:outline-none focus:ring-4 focus:ring-primary/20">
                        <span class="material-symbols-outlined text-[32px]"
                            style="font-variation-settings: 'FILL' 1;">mic</span>
                    </button>
                    <!-- Audio Level Meter (Static visual representation) -->
                    <div class="flex gap-1 h-2 items-end">
                        <div class="w-1.5 h-1 bg-primary/40 rounded-full"></div>
                        <div class="w-1.5 h-2 bg-primary/60 rounded-full"></div>
                        <div class="w-1.5 h-full bg-primary rounded-full"></div>
                        <div class="w-1.5 h-1 bg-primary/40 rounded-full"></div>
                    </div>
                </div>
                <!-- Primary Action: Submit Answer -->
                <button
                    class="px-6 py-3 rounded bg-on-surface text-surface font-body-md text-body-md font-medium hover:bg-on-surface/90 transition-colors flex items-center gap-2 shadow-sm">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                    確認送出回答
                </button>
            </div>
        </section>
    </main>
    <script>
        // Initialize Waveform Animation
        document.addEventListener('DOMContentLoaded', () => {
            const waveformContainer = document.getElementById('ai-waveform');
            if (waveformContainer) {
                // Generate 16 bars
                for (let i = 0; i < 16; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'waveform-bar';

                    // Randomize height and animation delay for organic feel
                    const delay = Math.random() * -1.5;
                    const scale = 0.5 + Math.random() * 0.5;

                    bar.style.animationDelay = `${delay}s`;
                    // Apply random max height via custom property or inline style if needed, 
                    // relying on the scaleY animation defined in CSS for now.

                    // Make some bars 'dim' to simulate varying frequencies
                    if (Math.random() > 0.8) {
                        bar.classList.add('bg-dim');
                        bar.style.animation = 'none';
                    }

                    waveformContainer.appendChild(bar);
                }
            }
        });
    </script>
</body>

</html>
